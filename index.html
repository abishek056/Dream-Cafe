<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Dream Cafe </title>
  <link rel="stylesheet" href="./dist/output.css" />
</head>
<body class="font-display bg-cream text-gray-800">

  <!-- NAVBAR  -->

  <header class="absolute top-0 left-0 w-full z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
    
        <a href="#" class="flex items-center gap-2 text-white">
          <span class="text-3xl">☕</span>
          <span class="text-2xl font-bold tracking-wide">DREAM CAFE</span>
        </a>

  
        <nav class="hidden md:flex items-center gap-10">
          <a href="#home" class="text-lg font-medium text-white/90 hover:text-amber-300 transition">Home</a>
          <a href="#products" class="text-lg font-medium text-white/90 hover:text-amber-300 transition">Products</a>
          <a href="#services" class="text-lg font-medium text-white/90 hover:text-amber-300 transition">Services</a>
          <a href="#review" class="text-lg font-medium text-white/90 hover:text-amber-300 transition">Review</a>
        </nav>

        
        <a href="#products" 
           class="bg-amber-500 hover:bg-amber-600 text-white px-6 py-2.5 rounded-full text-sm font-semibold transition shadow-lg">
          BUY COFFEE
        </a>

      </div>
    </div>
  </header>

   <!-- HERO SECTION -->
  <section id="home" class="relative min-h-screen flex items-center overflow-hidden">
    
   
    <div class="absolute inset-0">
      <img 
        src="./assets/images/background.jpg" 
        alt="Coffee background" 
        class="w-full h-full object-cover"
      />
      <div class="absolute inset-0 bg-black/55"></div>
    </div>

    <!-- Content -->
    <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full pt-20">
      <div class="max-w-2xl text-white">
        
        <p class="text-amber-300 font-medium tracking-[0.25em] uppercase text-xl mb-5">
          Welcome to Dream Cafe
        </p>
        
        <h1 class="text-5xl sm:text-6xl md:text-7xl font-extrabold leading-[1.1] mb-6">
          Elevate Your<br />
          <span class="text-amber-400">Coffee</span> Moment
        </h1>
        
        <p class="text-lg md:text-xl text-gray-200 mb-10 leading-relaxed max-w-lg">
          Handcrafted coffee made from the finest beans.<br />
          Experience rich aroma and perfect taste in every cup.
        </p>

        <div class="flex flex-col sm:flex-row gap-4">
          <a href="#products" 
             class="inline-flex items-center justify-center bg-amber-500 hover:bg-amber-600 text-white px-8 py-3.5 rounded-full font-semibold text-sm transition shadow-lg">
            Explore Menu
          </a>
          <a href="#services" 
             class="inline-flex items-center justify-center border-2 border-white/70 hover:bg-white/10 text-white px-8 py-3.5 rounded-full font-semibold text-sm transition">
            Our Story
          </a>
        </div>

      </div>
    </div>
  </section>

</body>
</html>
